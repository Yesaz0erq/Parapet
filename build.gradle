plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

group = 'dev.parapet'
version = project.mod_version

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeModule 'maven.modrinth', 'carry-on' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.blamejared.com/' }
        }
        filter { includeGroup 'mezz.jei' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        parapet {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "maven.modrinth:carry-on:9UKSKr1K"
    clientCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:31.14.0.72"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand(version: inputs.properties.version)
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
